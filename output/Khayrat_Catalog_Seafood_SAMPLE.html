<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خيرات البقاع الأخضر — أسماك ومأكولات بحرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
/* ── Variables ─────────────────────────────────────────────── */
:root {
  --green:       #2D7A2D;
  --green-light: #4CAF50;
  --green-pale:  #E8F5E9;
  --green-mid:   #A5D6A7;
  --yellow:      #F5C800;
  --yellow-dark: #E6B800;
  --cream:       #FFFDE7;
  --card-bg:     #FFFFFF;
  --dark:        #1A1A1A;
  --grey:        #666666;
  --border:      #D0D0D0;
  --red:         #C62828;
  --shadow:      0 2px 12px rgba(0,0,0,.10);
  --radius:      12px;
  --font:        'Cairo', 'Amiri', 'Arial', sans-serif;
}

/* ── Reset / Base ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--cream);
  color: var(--dark);
  direction: rtl;
  min-height: 100vh;
}

/* ── Page wrapper ──────────────────────────────────────────── */
.page {
  width: 210mm;
  min-height: 297mm;
  margin: 0 auto;
  padding: 14mm 14mm 10mm;
  background: var(--cream);
  position: relative;
  overflow: hidden;
}

/* ── Background pattern ─────────────────────────────────────── */
.page::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle, rgba(45,122,45,.04) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
}

/* ── Header ─────────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: white;
  border: 2px solid var(--green);
  border-radius: var(--radius);
  padding: 10px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--yellow) 0%, var(--green) 60%, var(--yellow) 100%);
}

.logo-wrap img {
  height: 60px;
  width: auto;
  object-fit: contain;
  display: block;
}

.header-text {
  text-align: right;
  flex: 1;
}
.header-text h1 {
  font-size: 22px;
  font-weight: 900;
  color: var(--green);
  line-height: 1.2;
  letter-spacing: -0.3px;
}
.header-text h2 {
  font-size: 14px;
  font-weight: 700;
  color: var(--yellow-dark);
  margin-top: 2px;
}
.header-text p {
  font-size: 10px;
  color: var(--grey);
  margin-top: 2px;
}

/* ── Section banner ──────────────────────────────────────────── */
.section-banner {
  background: var(--green);
  color: white;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 0;
  border-radius: 6px;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
}
.section-banner::before,
.section-banner::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 10px;
  background: var(--yellow);
  border-radius: 4px;
}
.section-banner::before { right: 0; }
.section-banner::after  { left: 0; }

/* ── Product grid ────────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}

/* ── Product card ────────────────────────────────────────────── */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  transition: transform .2s, box-shadow .2s;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,.14);
}

/* Image area */
.card-img-wrap {
  background: var(--green-pale);
  display: flex;
  align-items: center;
  justify-content: center;
  height: 130px;
  position: relative;
  overflow: hidden;
}
.card-img-wrap img {
  max-width: 100%;
  max-height: 120px;
  object-fit: contain;
  display: block;
  padding: 6px;
  transition: opacity .3s;
}

/* Placeholder shown while image loads or on error */
.placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--green-pale);
  color: var(--grey);
  font-size: 9px;
  gap: 6px;
  z-index: 1;
}
.placeholder svg {
  opacity: .35;
}

/* Yellow divider stripe */
.stripe {
  height: 3px;
  background: linear-gradient(90deg, var(--yellow) 0%, var(--green-light) 100%);
  flex-shrink: 0;
}

/* Card body */
.card-body {
  padding: 8px 8px 0;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.card-name {
  font-size: 11px;
  font-weight: 700;
  color: var(--dark);
  text-align: center;
  line-height: 1.4;
  margin-bottom: 3px;
  direction: rtl;
}
.card-brand {
  font-size: 9px;
  font-weight: 600;
  color: var(--green);
  text-align: center;
  letter-spacing: .4px;
  margin-bottom: auto;
}

/* Card footer (barcode) */
.card-footer {
  background: var(--green-pale);
  padding: 4px 8px 5px;
  text-align: center;
  margin-top: 6px;
  border-top: 1px solid var(--green-mid);
  border-radius: 0 0 var(--radius) var(--radius);
}
.barcode-label {
  font-size: 8px;
  color: var(--green);
  font-weight: 600;
  letter-spacing: .3px;
  direction: ltr;
  display: block;
}
.barcode-num {
  font-size: 10px;
  font-weight: 900;
  color: var(--dark);
  font-family: 'Courier New', monospace;
  letter-spacing: 1px;
  direction: ltr;
  display: block;
  margin-top: 1px;
}

/* ── Footer ──────────────────────────────────────────────────── */
.footer {
  background: var(--green);
  color: white;
  text-align: center;
  font-size: 10px;
  font-weight: 600;
  padding: 7px 0 6px;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
  margin-top: 4px;
}
.footer::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--yellow);
}

/* ── Print styles ────────────────────────────────────────────── */
@media print {
  body { background: white; }
  .page {
    width: 100%;
    padding: 10mm;
    box-shadow: none;
    margin: 0;
  }
  .card { break-inside: avoid; }
  .card:hover { transform: none; box-shadow: var(--shadow); }
}
@page {
  size: A4 portrait;
  margin: 0;
}
</style>
</head>

function tryImages(imgEl, urls, idx) {
  if (idx >= urls.length) {
    // All failed — show placeholder text
    imgEl.style.display = 'none';
    const wrap = imgEl.closest('.card-img-wrap');
    const ph = wrap.querySelector('.placeholder');
    if (ph) ph.style.zIndex = 2;
    return;
  }
  imgEl.onload  = () => {
    imgEl.style.opacity = 1;
    const ph = imgEl.closest('.card-img-wrap').querySelector('.placeholder');
    if (ph) ph.style.display = 'none';
  };
  imgEl.onerror = () => tryImages(imgEl, urls, idx + 1);
  imgEl.src = urls[idx];
  imgEl.style.opacity = 0;
  // Fade in once loaded via onload
  imgEl.style.transition = 'opacity .4s';
}

const grid = document.getElementById('grid');

PRODUCTS.forEach(p => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-img-wrap">
      <div class="placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="1.5">
          <path d="M20 12c-2-4-5-6-8-6S6 8 4 12c2 4 5 6 8 6s6-2 8-6z"/>
          <circle cx="12" cy="12" r="2"/>
        </svg>
        <span>الصورة غير متوفرة</span>
      </div>
      <img alt="${p.name_ar}" loading="lazy" style="opacity:0;position:relative;z-index:2;">
    </div>
    <div class="stripe"></div>
    <div class="card-body">
      <div class="card-name">${p.name_ar}</div>
      <div class="card-brand">${p.brand}</div>
    </div>
    <div class="card-footer">
      <span class="barcode-label">Barcode</span>
      <span class="barcode-num">${p.barcode}</span>
    </div>
  `;
  grid.appendChild(card);

  const img = card.querySelector('img');
  tryImages(img, p.img_urls, 0);
});
